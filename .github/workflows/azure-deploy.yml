name: Deploy Voyage to Azure

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: voyage-app # Replace with your Azure Web App name
  NODE_VERSION: '22'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (server uses an in-memory MongoDB)
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build project (client & server)
        run: npm run build

      # Only what the server needs at runtime: compiled server, built client, server production deps.
      - name: Assemble deployment package
        run: |
          mkdir -p deploy/server deploy/client
          cp package.json package-lock.json deploy/
          cp server/package.json deploy/server/
          cp -r server/dist deploy/server/
          cp client/package.json deploy/client/
          cp -r client/dist deploy/client/
          cd deploy
          npm ci --omit=dev --workspace=@voyage/server --include-workspace-root --no-audit --no-fund
          # Zip deploy does not keep symlinks reliably and nothing imports the workspace packages by name.
          rm -rf node_modules/@voyage

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: voyage-app
          path: deploy
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: voyage-app
          path: deploy

      # App Service settings required (see docs/AZURE_DEPLOYMENT.md): NODE_ENV, MONGODB_URI, SESSION_SECRET,
      # CORS_ORIGINS, TRUST_PROXY=1, CLIENT_DIST_DIR=client/dist, SCM_DO_BUILD_DURING_DEPLOYMENT=false.
      # Startup command: npm start
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
